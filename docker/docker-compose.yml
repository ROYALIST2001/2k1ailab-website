name: company

services:
  web:
    build:
      # Root of the monorepo — the Dockerfile needs every workspace manifest.
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into the client bundle at build time. Rebuild to change it.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: company/web:latest
    container_name: company-web
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # Server-side only; safe to change without a rebuild.
      CONTACT_INBOX: ${CONTACT_INBOX:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      BACKEND_API_URL: ${BACKEND_API_URL:-}
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
